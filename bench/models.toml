# Models the eval can call, as solvers (--models) or judges (--judges).
# The table name is what you pass on the command line.
#
# provider:
#   anthropic         Anthropic Messages API (key: ANTHROPIC_API_KEY, or an `ant auth login` profile)
#   openai_responses  OpenAI Responses API (key from api_key_env)
#   openai_chat       any OpenAI-compatible Chat Completions endpoint, e.g. Z.ai (key from api_key_env)
#   mock              offline stand-in for testing the pipeline; makes no network calls
#
# Every model runs at the same reasoning effort ("high") so the comparison is fair.
# Change it per model if you want to sweep effort.

[models."fable-5.2"]
provider = "anthropic"
model = "claude-fable-5-2"
effort = "high"        # thinking is always on for Fable 5.2; effort sets how much
max_tokens = 32000
# Server-side refusal fallback: if Fable declines, the API re-runs the request on another
# Claude model. Answers served by a fallback are flagged in responses.jsonl and counted in
# the report. Set to false to record a refusal instead.
fallbacks = true

[models."glm-5.3"]
provider = "openai_chat"
model = "glm-5.3"
base_url = "https://api.z.ai/api/paas/v4/"   # GLM Coding Plan keys use https://api.z.ai/api/coding/paas/v4/
api_key_env = "ZAI_API_KEY"
max_tokens = 32000
# GLM-5.3 always reasons ("disabled" is rejected). reasoning_effort: low | high | max.
extra_body = { thinking = { type = "enabled" }, reasoning_effort = "high" }

[models."astra"]
provider = "openai_responses"
model = "gpt-6-astra"
api_key_env = "OPENAI_API_KEY"
effort = "high"        # low | medium | high | xhigh | max
max_tokens = 32000

# ---- judges ----

[models."opus-5.5"]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "high"        # Opus 5.5 defaults to medium; grading deserves high
max_tokens = 16000
fallbacks = true

# ---- offline testing ----

[models."mock"]
provider = "mock"
model = "mock"
