schema_version = "1.3"

[task]
name = "daanaea/g4p2-L34-014"
version = "1.0.0"
description = "Text-only Sakha school exercise"

[metadata]
dataset = "yakut/vals-90"
grade = "4"
source_needs_visual = false

[environment]
docker_image = "python:3.12-slim"
workdir = "/workspace"
cpus = 1
memory_mb = 1024

[agent]
timeout_sec = 910
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com", "openrouter.ai", "foundation-models.api.cloud.ru"]

[verifier]
timeout_sec = 900
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]

[[artifacts]]
source = "/logs/verifier/judgment.json"
destination = "judgment.json"
