# Recovery profile: same model families and generation limits, three direct Modal endpoints.
# New evaluation profile: 900-second answer deadline and 33,000 requested output tokens.
# Gemma is capped by its provider at 16,384 tokens. Original v0/v1 settings remain in models.toml.
# Models the eval can call, as solvers (--models) or judges (--judges).
# The table name is what you pass on the command line.
#
# provider:
#   anthropic         Anthropic Messages API (key from api_key_env)
#   openai_responses  OpenAI Responses API (key from api_key_env)
#   openai_chat       any OpenAI-compatible Chat Completions endpoint, e.g. Z.ai (key from api_key_env)
#   mock              offline stand-in for testing the pipeline; makes no network calls
#
# Request high reasoning effort where supported. Effort levels aren't equivalent
# across vendors. Gemma uses its default non-thinking mode: thinking exhausted
# its 16,384-token output ceiling before producing an answer in the smoke test.

[models."fable-5.2"]
provider = "anthropic"
model = "claude-fable-5-2"
api_key_env = "ANTHROPIC_API_KEY"
effort = "high"        # thinking is always on for Fable 5.2; effort sets how much
max_tokens = 33000
timeout = 900
max_retries = 0
deadline_seconds = 900
# Server-side refusal fallback: if Fable declines, the API re-runs the request on another
# Claude model. Answers served by a fallback are flagged in responses.jsonl and counted in
# the report. Set to false to record a refusal instead.
fallbacks = true

[models."glm-5.3"]
provider = "openai_chat"
model = "zai-org/GLM-5.3"
base_url = "https://eginovasardaana--ep-ykt-vals90-glm-5-3-server.us-west.modal.direct/v1"
api_key_env = "MODAL_INFERENCE_API_KEY"
max_tokens = 33000
timeout = 900
max_retries = 0
deadline_seconds = 900
extra_body = { reasoning_effort = "high" }

[models."astra"]
provider = "openai_responses"
model = "gpt-6-astra"
api_key_env = "OPENAI_API_KEY"
